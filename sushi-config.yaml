id: ysnr.fhir-client
canonical: http://fhir-client.local
name: FhirClientImplementationGuide
title: "fhir-client 実装ガイド"
description: >-
  fhir-client(電子カルテ Web クライアント)が上流 FHIR サーバーに作成する FHIR R4 リソースの仕様。
  独自 Extension・CodeSystem・識別子体系、JP Core プロファイルの利用方法、リソース間の参照関係を定義する。
status: draft
version: 0.1.0
fhirVersion: 4.0.1
releaseLabel: ci-build
copyrightYear: 2026+
license: CC0-1.0
publisher:
  name: ysnr-dev
  url: https://github.com/ysnr-dev
jurisdiction: urn:iso:std:iso:3166#JP "Japan"

dependencies:
  jpfhir.jp.core: 1.2.0

parameters:
  show-inherited-invariants: false
  excludexml: true
  excludettl: true
  excludemap: true
  apply-contact: true
  apply-jurisdiction: true
  apply-publisher: true
  apply-version: true
  usage-stats-opt-out: true
  i18n-default-lang: ja
  # coding.display の不一致(アプリは HL7 のコードにも日本語 display を付ける)をエラーにしない
  displayWarnings: true
  # ePath(クリニカルパス)の拡張は定義を読み込まないので、この domain の未知の拡張を許す
  extension-domain: http://e-path.jp
  # backend が書く拡張のうち、canonical(http://fhir-client.local/StructureDefinition/...)の外にある URL
  special-url: http://fhir-client.local/integrations/receipt-computer/StructureDefinition/reception-coverage-set

